http.port=8080

kafka.bootstrap.servers=localhost:9092
order.created.endpoint=kafka:order-created?brokers={{kafka.bootstrap.servers}}&keySerializer=org.apache.kafka.common.serialization.StringSerializer&valueSerializer=org.apache.kafka.common.serialization.StringSerializer
order.created.consumer.endpoint=kafka:order-created?brokers={{kafka.bootstrap.servers}}&groupId=order-storage-service&autoOffsetReset=earliest&consumersCount=1
order.created.retry.max=3
order.created.retry.delay.ms=1000
order.created.persistence.endpoint=sql:{{order.created.insert.sql}}?dataSource=#ordersDataSource
order.created.dlt.endpoint=sql:{{order.created.dlt.insert.sql}}?dataSource=#ordersDataSource

postgres.host=localhost
postgres.port=5432
postgres.database=ecommerce
postgres.username=ecommerce
postgres.password=ecommerce
order.created.insert.sql=INSERT INTO order_events (order_id, customer_id, total_amount, status, received_at, payload) VALUES (:#orderId, :#customerId, :#totalAmount, :#status, :#receivedAt, :#payload)
order.created.dlt.insert.sql=INSERT INTO order_event_dlt (event_id, failed_at, failure_reason, payload) VALUES (:#eventId, :#failedAt, :#failureReason, :#payload)